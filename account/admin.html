<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://djyimnbupvgbzzdbgsom.supabase.co; base-uri 'none'; form-action 'none'">
  <title>TNN access</title><link rel="stylesheet" href="account.css"><script type="module" src="admin.js"></script>
</head>
<body><main class="admin">
  <header><img class="logo" src="../assets/logo-icon.svg" alt="TNN"><h1>TNN access</h1><button class="ghost" id="sign-out" hidden>Sign out</button></header>
  <section class="card" id="sign-in"><h2>Sign in</h2><p>Use your TNN administrator email.</p>
    <form id="login"><label>Email<input id="email" type="email" autocomplete="email" required></label><button>Send sign-in link</button></form>
  </section>
  <section id="panel" hidden>
    <div class="card"><h2>Free PRO access</h2><p>These emails get PRO as soon as they confirm their account.</p>
      <form id="grant"><label>Email addresses<textarea id="emails" rows="4" placeholder="one@example.com&#10;two@example.com" required></textarea></label><button>Grant free PRO</button></form>
    </div>
    <div class="card"><h2>People</h2><label>Search by email<input id="search" type="search" placeholder="Find an email" autocomplete="off"></label><div id="users"></div></div>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main></body></html>
